<title>סולמות ונחשים של ידע</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: board on one side, a control panel (players, die, question) on the other; stacks on phones */
:root {
  --bg: #eef3f2;
  --panel: #fbfdfc;
  --ink: #17282a;
  --muted: #5a6e70;
  --line: #cfdcda;
  --cell-a: #e3eeec;
  --cell-b: #cfe1dd;
  --accent: #0e6a6a;
  --accent-ink: #ffffff;
  --ladder: #b77a1f;
  --snake: #7b3fa3;
  --snake-belly: #c9a3e0;
  --good: #1d7a46;
  --good-soft: #def2e5;
  --bad: #b3261e;
  --bad-soft: #f8e2df;
  --p1: #d64545; --p2: #2f6fd6; --p3: #d89b00; --p4: #2e9a5a;
  --display: "Rubik", "Segoe UI", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101818; --panel: #172222; --ink: #e3eeec; --muted: #94a9a8; --line: #2b3b3a;
    --cell-a: #1b2928; --cell-b: #223634; --accent: #4fc2bd; --accent-ink: #0d1a1a;
    --ladder: #e0a64a; --snake: #b07ad6; --snake-belly: #5d3a78;
    --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
    --p1: #f07070; --p2: #6e9ef0; --p3: #f0c040; --p4: #5cc48a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #101818; --panel: #172222; --ink: #e3eeec; --muted: #94a9a8; --line: #2b3b3a;
  --cell-a: #1b2928; --cell-b: #223634; --accent: #4fc2bd; --accent-ink: #0d1a1a;
  --ladder: #e0a64a; --snake: #b07ad6; --snake-belly: #5d3a78;
  --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
  --p1: #f07070; --p2: #6e9ef0; --p3: #f0c040; --p4: #5cc48a; color-scheme: dark;
}
* { box-sizing: border-box; }
/* the Claude host adds this rule; repeated here so the page also works on a plain web host */
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; direction: rtl; }
.wrap {
  max-width: 1180px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(24px, 4.5vw, 34px); margin: 0 0 14px; text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 700; font-size: 18px; margin: 0; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn {
  font: 700 16px var(--body); padding: 10px 20px; border-radius: 8px; cursor: pointer;
  border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink);
}
.btn.ghost { background: transparent; color: var(--accent); }
a.btn { display: inline-block; text-decoration: none; }
.start-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.btn:disabled { opacity: .45; cursor: default; }

/* setup */
.setup { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 22px; max-width: 640px; }
.field { display: grid; gap: 10px; }
.field > label, .field > .lbl { font-weight: 700; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.seg { display: flex; flex-wrap: wrap; gap: 6px; }
.seg button {
  min-width: 44px; padding: 8px 12px; border-radius: 8px; border: 1.5px solid var(--line);
  background: transparent; cursor: pointer; font-family: var(--display); font-weight: 700; font-variant-numeric: tabular-nums;
}
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.names { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; }
.names .nm { display: flex; align-items: center; gap: 8px; }
.names input {
  flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line);
  background: var(--bg); color: var(--ink); font: inherit;
}
.chip { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: 0 0 0 2px var(--panel), 0 0 0 3px var(--line); }
.err { color: var(--bad); font-weight: 600; margin: 0; }

/* game */
.game { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(300px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 860px) { .game { grid-template-columns: 1fr; } }
.board-col { display: grid; gap: 12px; justify-items: center; min-width: 0; }
.board-wrap { position: relative; width: 100%; max-width: 680px; aspect-ratio: 1; justify-self: center; }
.board-alert {
  font: 800 clamp(22px, 4vw, 30px) var(--display); color: var(--panel); background: var(--snake);
  padding: 8px 22px; border-radius: 10px; text-align: center;
}
.board-alert.ladder { background: var(--ladder); }
@media (prefers-reduced-motion: no-preference) { .board-alert.blink { animation: alertBlink .5s steps(1) 3; } }
@keyframes alertBlink { 50% { opacity: 0; } }
.board {
  position: absolute; inset: 0; display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr);
  border-radius: 10px; overflow: hidden; border: 2px solid var(--line); direction: ltr;
}
.cell { position: relative; background: var(--cell-a); border: .5px solid var(--line); }
.cell.alt { background: var(--cell-b); }
.cell .n { position: absolute; top: 3px; right: 5px; font: 700 clamp(8px, 1.5vw, 12px) var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.cell.end { background: var(--accent); }
.cell.end .n { color: var(--accent-ink); }
.cell .tag { position: absolute; bottom: 3px; left: 0; right: 0; text-align: center; font: 700 clamp(7px, 1.2vw, 11px) var(--display); color: var(--muted); }
.cell.end .tag { color: var(--accent-ink); }
svg.over { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.tokens { position: absolute; inset: 0; pointer-events: none; }
.token {
  position: absolute; width: 4.6%; height: 4.6%; border-radius: 50%;
  border: 2px solid var(--panel); box-shadow: 0 2px 4px rgb(0 0 0 / .35);
  transform: translate(-50%, -50%);
}
@media (prefers-reduced-motion: no-preference) { .token { transition: left .16s ease, top .16s ease; } }

.side { display: grid; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: grid; gap: 12px; min-width: 0; }
.players { display: grid; gap: 6px; }
.pl { display: grid; grid-template-columns: auto 1fr auto auto; gap: 10px; align-items: center; padding: 7px 10px; border-radius: 8px; border: 1.5px solid transparent; }
.pl.turn { border-color: var(--accent); background: var(--bg); }
.pl .name { font-weight: 700; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl .sq, .pl .pts { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; white-space: nowrap; }
.pl .pts b { color: var(--ink); font-family: var(--display); font-size: 16px; }
.turn-row { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.die {
  width: 58px; height: 58px; border-radius: 12px; border: 2px solid var(--ink); background: var(--panel);
  display: grid; place-items: center; font: 800 24px var(--display); flex: none; font-variant-numeric: tabular-nums;
}
.turn-text .sub.ladder { color: var(--ladder); font-weight: 600; }
.turn-text .sub.snake { color: var(--snake); font-weight: 600; }
.rank { display: grid; gap: 6px; text-align: right; }
.rank .pl { grid-template-columns: auto auto 1fr auto auto; }
.rank .place { font: 800 16px var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.turn-text { flex: 1; min-width: 0; }
.turn-text .who { font-family: var(--display); font-weight: 700; font-size: 18px; }
.turn-text .sub { color: var(--muted); font-size: 14px; }

.qhead { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.lvl { font-family: var(--display); font-weight: 700; color: var(--accent); }
.qtext { font-weight: 700; font-size: 18px; margin: 0; }
.clock { display: block; width: min(210px, 62vw); margin: 4px auto; }
.clock .face { fill: var(--panel); stroke: var(--ink); stroke-width: 4; }
.clock .tick { stroke: var(--muted); stroke-width: 1.5; }
.clock .tick.big { stroke: var(--ink); stroke-width: 3.5; }
.clock text { fill: var(--ink); font-family: var(--display); font-weight: 700; font-size: 17px; text-anchor: middle; dominant-baseline: central;
  paint-order: stroke; stroke: var(--panel); stroke-width: 5px; }
.clock .hh { stroke: var(--ink); stroke-width: 7; stroke-linecap: round; }
.clock .mh { stroke: var(--accent); stroke-width: 4; stroke-linecap: round; }
.clock .pin { fill: var(--ink); }
.opts { display: grid; gap: 8px; }
.opt {
  display: flex; gap: 10px; align-items: center; padding: 9px 12px; border-radius: 8px;
  border: 1.5px solid var(--line); background: transparent; cursor: pointer; text-align: right;
}
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt:disabled { cursor: default; }
.opt .k { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--muted); display: grid; place-items: center; font: 700 13px var(--display); flex: none; }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .k { background: var(--good); border-color: var(--good); color: var(--panel); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .k { background: var(--bad); border-color: var(--bad); color: var(--panel); }
/* the question card takes a light tint of the current player's color */
#qCard { background: color-mix(in srgb, var(--pc, var(--panel)) 14%, var(--panel)); border-color: color-mix(in srgb, var(--pc, var(--line)) 55%, var(--line)); border-width: 2px; }
.feedback { padding: 12px 14px; border-radius: 8px; font: 800 20px/1.4 var(--display); }
#log { font: 700 19px/1.5 var(--display); color: var(--ink); background: var(--panel); border-radius: 8px; padding: 10px 14px; }
.feedback.ok { background: var(--good-soft); color: var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--bad); }
.feedback .ex { display: block; font: 400 16px/1.5 var(--body); color: var(--ink); margin-top: 6px; }
.log { color: var(--muted); font-size: 14px; margin: 0; }
.more { border-top: 1px dashed var(--line); padding-top: 10px; }
.more summary { cursor: pointer; font-family: var(--display); font-weight: 700; color: var(--accent); }
.more p { margin: 8px 0 0; font-size: 15px; line-height: 1.65; max-width: 62ch; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 18px; height: 4px; border-radius: 2px; display: inline-block; }
.cell .trap { position: absolute; inset: 0; display: grid; place-items: center; font-size: clamp(14px, 3.4vw, 26px); line-height: 1; }
.exam-bar { display: flex; gap: 6px; }
.exam-bar i { flex: 1; height: 6px; border-radius: 3px; background: var(--line); }
.exam-bar i.ok { background: var(--good); }
.exam-bar i.no { background: var(--bad); }
.win { text-align: center; --pc: var(--accent); border: 3px solid var(--pc); background: linear-gradient(180deg, color-mix(in srgb, var(--pc) 22%, var(--panel)), var(--panel) 60%); }
.win .trophy { font-size: 72px; line-height: 1; }
.win .big { font: 800 30px/1.3 var(--display); color: var(--pc); }
.win .rank .pl:first-child { box-shadow: 0 0 0 2px var(--pc) inset; }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
@media (prefers-reduced-motion: no-preference) {
  .win.pop { animation: winPop .7s cubic-bezier(.2, 1.6, .4, 1) both; }
  .win.pop .trophy { animation: trophy 1.2s ease-in-out .5s infinite alternate; }
  .win.pop .big { animation: shine 1.6s ease-in-out infinite alternate; }
}
@keyframes winPop { from { transform: scale(.4) rotate(-6deg); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes trophy { from { transform: translateY(0) rotate(-8deg) scale(1); } to { transform: translateY(-8px) rotate(8deg) scale(1.12); } }
@keyframes shine { from { text-shadow: 0 0 0 transparent; } to { text-shadow: 0 0 18px color-mix(in srgb, var(--pc) 60%, transparent); } }
</style>

<div class="wrap">
  <h1>סולמות ונחשים של ידע</h1>
  <p class="err" id="crash" hidden></p>

  <section class="setup" id="setup">
    <div class="field">
      <span class="lbl">מספר שחקנים</span>
      <div class="seg" id="count" role="group" aria-label="מספר שחקנים"></div>

      <span class="lbl">שמות</span>

    </div>
    <div class="field">

      <div class="seg" id="levels" role="group" aria-label="רמת קושי"></div>

    </div>
    <p class="err" id="loadErr" hidden></p>
    <div class="start-row"><button class="btn" id="startBtn" type="button">התחלת משחק</button><a class="btn ghost" href="kids.html">🧸 מצב ילדים</a></div>

  <section class="game" id="game" hidden>

        </div>

      </div>

      <div class="card" id="turnCard">
        <div class="turn-row">
          <div class="die" id="die" aria-label="המשבצת הנוכחית">1</div>

            <div class="who" id="who"></div>
            <div class="sub" id="sub"></div>
          </div>
        </div>
      </div>

      <div class="card" id="qCard" hidden>
        <div class="qhead"><span class="lvl" id="qLvl"></span><span id="qCat"></span></div>
        <div class="exam-bar" id="examBar" hidden></div>
        <p class="qtext" id="qText"></p>
        <svg class="clock" id="qClock" viewBox="0 0 200 200" role="img" aria-label="שעון מחוגים" hidden></svg>
        <div class="opts" id="qOpts"></div>

        <div class="feedback" id="fb" hidden></div>

      <div class="card win" id="winCard" hidden>

      </div>
    </div>
  </section>
</div>

<script>
const LADDERS = { 4: 14, 9: 31, 21: 42, 28: 84, 51: 67, 72: 91, 80: 99 };
const SNAKES  = { 17: 7, 54: 34, 62: 19, 64: 60, 87: 24, 93: 73, 95: 75, 98: 79 };
// hidden squares: stepping on one reveals it and opens a 5-question exam; only a perfect exam counts
const TRAPS = { balloon: { icon: "🎈", name: "כדור פורח", count: 3 }, mine: { icon: "💣", name: "מוקש", count: 3 } };
const EXAM_LEN = 5, TRAP_JUMP = 10, MAX_LEVEL = 11;
// balloons ask easy questions (bottom of the range), mines ask one level above the chosen level
const examLevel = (kind, L) => kind === "balloon" ? Math.max(1, L - 2) : Math.min(MAX_LEVEL, L + 1);
const COLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
const LETTERS = ["א", "ב", "ג", "ד"];
const $ = id => document.getElementById(id);

// ---------- sound: short effects synthesized with Web Audio, so there are no audio files ----------
let audio = null, soundOn = true;
try { soundOn = localStorage.getItem("snl-sound") !== "off"; } catch (e) {}
function ac() {
  if (!audio) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return null; audio = new A(); }
  if (audio.state === "suspended") audio.resume();
  return audio;
}
// one oscillator note; `to` slides the pitch over the note
function tone(c, t0, freq, dur, { type = "sine", vol = .18, to } = {}) {
  const o = c.createOscillator(), g = c.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(c.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function noise(c, t0, dur, vol, from, to, type = "lowpass") {
  const buf = c.createBuffer(1, c.sampleRate * dur, c.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  s.buffer = buf; f.type = type;
  f.frequency.setValueAtTime(from, t0); f.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(f).connect(g).connect(c.destination); s.start(t0);
}
const SFX = {
  right:   (c, t) => { tone(c, t, 660, .12); tone(c, t + .1, 880, .2); },
  wrong:   (c, t) => { tone(c, t, 220, .22, { type: "square", vol: .06 }); tone(c, t + .18, 165, .3, { type: "square", vol: .06 }); },
  mine:    (c, t) => { for (let i = 0; i < 3; i++) { tone(c, t + i * .26, 880, .12, { type: "square", vol: .07 }); tone(c, t + i * .26 + .13, 660, .12, { type: "square", vol: .07 }); } },
  balloon: (c, t) => { tone(c, t, 300, .7, { to: 900, vol: .14 }); tone(c, t + .05, 450, .7, { to: 1350, vol: .06 }); },
  fly:     (c, t) => { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(c, t + i * .09, f, .3, { type: "triangle", vol: .16 })); },
  defuse:  (c, t) => { tone(c, t, 1800, .04, { type: "square", vol: .08 }); [784, 988, 1175].forEach((f, i) => tone(c, t + .12 + i * .1, f, .35, { vol: .15 })); },
  boom:    (c, t) => { noise(c, t, 1.2, .6, 1800, 60); tone(c, t, 110, .9, { to: 30, vol: .5 }); },
  // climbing rungs: a quick run of steps up a major scale
  ladder:  (c, t) => { [392, 440, 494, 523, 587, 659, 740, 784].forEach((f, i) => tone(c, t + i * .07, f, .12, { type: "triangle", vol: .14 })); },
  // a hiss, then a long slide down
  snake:   (c, t) => { noise(c, t, .6, .12, 4000, 6000, "highpass"); tone(c, t + .35, 520, .9, { type: "triangle", to: 90, vol: .16 }); },
  // drum roll, trumpet fanfare, a big held chord with a cymbal, then firework pops
  win:     (c, t) => {
    for (let i = 0; i < 16; i++) noise(c, t + i * .05, .06, .05 + i * .012, 900, 200);
    const f0 = t + .85;
    [[523, 0, .16], [523, .17, .16], [523, .34, .16], [659, .51, .5], [587, 1.05, .16], [659, 1.22, .16], [784, 1.39, .9]]
      .forEach(([f, d, len]) => { tone(c, f0 + d, f, len, { type: "sawtooth", vol: .07 }); tone(c, f0 + d, f * 2, len, { type: "triangle", vol: .07 }); });
    const ch = f0 + 2.35;
    noise(c, ch, 1.8, .22, 9000, 3000, "highpass");
    noise(c, ch, .5, .5, 600, 60);
    [262, 523, 659, 784, 1047, 1319].forEach(f => tone(c, ch, f, 2.4, { type: "triangle", vol: .07 }));
    [1047, 1319, 1568, 2093].forEach((f, i) => tone(c, ch + .2 + i * .12, f, .4, { vol: .06 }));

      box.appendChild(b);
    });
    const fb = $("fb");
    if (G.phase === "question") fb.hidden = true;
    else {
      const ok = G.pick === q.answer;
      fb.hidden = false; fb.className = "feedback " + (ok ? "ok" : "no");
      fb.textContent = ok ? `נכון! +${reward(q.level)} נקודות` : `לא נכון, −${penalty(q.level)} נקודות. התשובה: ${q.options[q.answer]}`;
      if (q.explain) { const s = document.createElement("span"); s.className = "ex"; s.textContent = q.explain; fb.appendChild(s); }
    }
    $("log").hidden = !G.msg; $("log").textContent = G.msg;
    $("more").hidden = G.phase === "question" || !q.expansion;
    $("moreText").textContent = q.expansion;
    $("nextBtn").hidden = G.phase !== "done" || !!G.winner;
    $("nextBtn").textContent = G.exam && !G.exam.started ? "למבחן" : ex && ex.passed == null ? "לשאלה הבאה במבחן" : "התור הבא";
  }

  $("winCard").hidden = !G.winner;
  if (G.winner) {
    const w = G.players[G.winner - 1];
    $("winCard").style.setProperty("--pc", COLORS[G.winner - 1]);
    $("winText").textContent = `🎉 ${w.name} ניצח/ה! 🎉`;
    // ranking: whoever reached 100 first, then by square, then by points
    const order = G.players.map((p, i) => ({ p, i })).sort((a, b) =>
      (b.i === G.winner - 1) - (a.i === G.winner - 1) || b.p.sq - a.p.sq || b.p.pts - a.p.pts);
    const rk = $("rank"); rk.innerHTML = "";
    order.forEach(({ p, i }, n) => {
      const r = document.createElement("div"); r.className = "pl";
      r.innerHTML = `<span class="place">${n + 1}</span><span class="chip" style="background:${COLORS[i]}"></span><span class="name"></span><span class="sq">משבצת ${p.sq} · ${p.asked} תורות · ${p.right} נכונות</span><span class="pts"><b>${p.pts}</b> נק'</span>`;
      r.querySelector(".name").textContent = p.name;
      rk.appendChild(r);
    });
    $("winSub").textContent = `${w.name} הגיע/ה ל-100 אחרי ${w.asked} תורות.`;
  }
}

function answer(oi) {
  if (G.exam && G.exam.started) return examAnswer(oi);
  const p = G.players[G.turn], q = G.q, ok = oi === q.answer, from = p.sq;
  G.pick = oi; p.asked++;
  sfx(ok ? (LADDERS[from] ? "ladder" : "right") : (SNAKES[from] ? "snake" : "wrong"));
  // expansions this player has read; groundwork for questions drawn from them later
  (p.seen = p.seen || []).push(q.id);
  if (q.expansion) (G.readAt = G.readAt || {})[q.id] = turnsPlayed();
  let msg;
  if (ok) {
    p.pts += reward(q.level); p.right++;
    if (LADDERS[from]) { p.sq = LADDERS[from]; msg = `טיפוס בסולם! ${p.name} עלה/תה ממשבצת ${from} למשבצת ${p.sq}.`; }
    else {
      p.sq = from + 1;
      msg = (SNAKES[from] ? `ניצלת מהנחש! ` : "") + `${p.name} התקדם/ה למשבצת ${p.sq}.`;
    }
  } else {
    p.pts -= penalty(q.level);
    if (SNAKES[from]) { p.sq = SNAKES[from]; msg = `${p.name} החליק/ה בנחש ממשבצת ${from} למשבצת ${p.sq}.`; }
    // a wrong answer on a ladder foot still moves one square, past the ladder
    else if (LADDERS[from]) { p.sq = from + 1; msg = `הסולם הוחמץ! ${p.name} התקדם/ה רק למשבצת ${p.sq}.`; }
    else msg = `${p.name} נשאר/ת במשבצת ${from}.`;
  }
  if (p.sq !== from) {
    msg += landingNote(p.sq);
    if (SNAKES[p.sq]) boardAlert("snake", .5);
    if (LADDERS[p.sq]) boardAlert("ladder", .5);
    const kind = G.traps && G.traps[p.sq];
    if (kind) {
      const t = TRAPS[kind], first = !G.revealed.includes(p.sq);
      if (first) G.revealed.push(p.sq);
      sfx(kind, .4);
      G.exam = { kind, sq: p.sq, level: examLevel(kind, G.level), n: 0, started: false, passed: null };
      msg += ` ${t.icon} ${first ? "נחשף" : "דרכת על"} ${t.name} במשבצת ${p.sq}! מבחן של ${EXAM_LEN} שאלות ברמה ${G.exam.level}: ` +
        (kind === "balloon" ? `רק ${EXAM_LEN} מתוך ${EXAM_LEN} יקפיצו אותך ${TRAP_JUMP} משבצות קדימה.` : `רק ${EXAM_LEN} מתוך ${EXAM_LEN} ימנעו נפילה של ${TRAP_JUMP} משבצות אחורה.`);
    }
  }
  if (p.sq === 100) win();
  G.msg = msg; G.phase = "done";
  render();
  if (!G.winner) $("nextBtn").focus();
}

// exam questions don't count as turns; the exam stops at the first mistake
function examAnswer(oi) {
  const p = G.players[G.turn], q = G.q, ex = G.exam, ok = oi === q.answer, from = p.sq, t = TRAPS[ex.kind];
  G.pick = oi;
  (p.seen = p.seen || []).push(q.id);
  if (q.expansion) (G.readAt = G.readAt || {})[q.id] = turnsPlayed();
  let msg;
  if (ok) {
    p.pts += reward(q.level); p.right++; ex.n++;
    if (ex.n < EXAM_LEN) { msg = `${ex.n} מתוך ${EXAM_LEN} נכונות.`; sfx("right"); }
    else {
      ex.passed = true; sfx(ex.kind === "balloon" ? "fly" : "defuse");
      if (ex.kind === "balloon") { p.sq = Math.min(100, from + TRAP_JUMP); msg = `${t.icon} הכדור המריא! ${p.name} עף/ה ממשבצת ${from} למשבצת ${p.sq}.` + landingNote(p.sq); }
      else msg = `${t.icon} המוקש נוטרל! ${p.name} נשאר/ת במשבצת ${from}.`;
    }
  } else {
    p.pts -= penalty(q.level); ex.passed = false; sfx(ex.kind === "mine" ? "boom" : "deflate");
    if (ex.kind === "mine") { p.sq = Math.max(1, from - TRAP_JUMP); msg = `${t.icon} בום! המוקש התפוצץ אחרי ${ex.n} נכונות. ${p.name} ירד/ה ממשבצת ${from} למשבצת ${p.sq}.` + landingNote(p.sq); }
    else msg = `${t.icon} הכדור לא המריא (${ex.n} מתוך ${EXAM_LEN}). ${p.name} נשאר/ת במשבצת ${from}.`;
  }
  if (p.sq !== from && SNAKES[p.sq]) boardAlert("snake", 1.3);
  if (p.sq !== from && LADDERS[p.sq]) boardAlert("ladder", 1.3);
  if (p.sq === 100) win();
  G.msg = msg; G.phase = "done";
  render();
  if (!G.winner) $("nextBtn").focus();
}

$("nextBtn").onclick = () => {
  if (G.exam && (!G.exam.started || G.exam.passed == null)) {
    G.exam.started = true;
    G.q = pickExamQuestion(G.exam.level); G.pick = null; G.msg = ""; G.phase = "question";
    render(); $("opt0").focus();
    return;
  }
  G.exam = null;
  G.turn = (G.turn + 1) % G.players.length;
  G.q = pickQuestion(); G.pick = null; G.msg = ""; G.phase = "question"; G.swapped = false;
  render();
  $("turnCard").scrollIntoView({ block: "nearest" });
};
$("swapBtn").onclick = () => {
  G.q = pickQuestion(); G.swapped = true;
  render(); $("opt0").focus();
};
function newGame() { G = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) {} $("game").hidden = true; $("setup").hidden = false; renderSetup(); }
$("againBtn").onclick = newGame;
// mid-game reset asks for a second click, since the current game is lost
let resetArmed = null;
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if (resetArmed) { clearTimeout(resetArmed); resetArmed = null; b.textContent = "משחק חדש"; newGame(); return; }
  b.textContent = "המשחק הנוכחי יימחק. ללחוץ שוב לאישור";
  resetArmed = setTimeout(() => { resetArmed = null; b.textContent = "משחק חדש"; }, 4000);
};

// ---------- persistence: a reload or an update of the page resumes the game ----------
const SAVE_KEY = "snl-game";
function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ setup, G })); } catch (e) {}
}
function savedGame() {
  try { return JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); } catch (e) { return null; }
}

// ---------- boot ----------
async function start(data) {
  const saved = data && data.G ? data : savedGame();
  if (saved && saved.setup) setup = saved.setup;
  renderSetup();
  if (!saved || !saved.G || saved.G.winner) return;
  try { await loadLevels([...saved.G.levels, examLevel("mine", saved.G.level)]); } catch (e) { return; }
  G = saved.G;
  if (!G.traps) { G.traps = placeTraps(); G.revealed = []; G.exam = null; }
  if (G.phase !== "question" && G.phase !== "done" || !G.q) { G.q = pickQuestion(); G.pick = null; G.phase = "question"; }
  showGame();
}
window.addEventListener("error", e => {
  const box = $("crash");
  box.textContent = "משהו השתבש במשחק. המצב נשמר, ורענון של הדף ימשיך מאותה נקודה. פרטים לתיקון: " + (e.message || e.error);
  box.hidden = false;
});
window.claude?.hot?.snapshot?.(() => ({ setup, G }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
