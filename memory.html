<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>זיכרון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Memory card game. Pairs are identical or "smart" (two things that go together),
   and optional special cards peek, shuffle or act as a joker. */
:root {
  --bg: #f1f0f7; --panel: #fcfcfe; --ink: #1d1b2c; --muted: #625f78; --line: #d6d4e3;
  --accent: #5b3fc4; --accent-ink: #ffffff;
  --back1: #5b3fc4; --back2: #7d63e0; --face: #ffffff;
  --good: #1d7a46; --good-soft: #def2e5; --bad: #b3261e; --bad-soft: #f8e2df;
  --p1: #d64545; --p2: #2f6fd6; --p3: #c98f00; --p4: #2e9a5a;
  --display: "Rubik", "Segoe UI", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13121c; --panel: #1c1a28; --ink: #e8e6f3; --muted: #a29fba; --line: #312e44;
    --accent: #a08cf5; --accent-ink: #15121f; --back1: #4a33a8; --back2: #6a52cc; --face: #26233a;
    --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
    --p1: #e05a5a; --p2: #4f86e8; --p3: #e0b030; --p4: #44b070; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13121c; --panel: #1c1a28; --ink: #e8e6f3; --muted: #a29fba; --line: #312e44;
  --accent: #a08cf5; --accent-ink: #15121f; --back1: #4a33a8; --back2: #6a52cc; --face: #26233a;
  --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
  --p1: #e05a5a; --p2: #4f86e8; --p3: #e0b030; --p4: #44b070; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; direction: rtl; }
.wrap {
  max-width: 1100px; margin: 0 auto; padding-block: 12px 24px; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 32px); margin: 0; }
.back { color: var(--accent); font-weight: 700; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font: 700 16px var(--body); padding: 10px 20px; border-radius: 8px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* setup */
.setup { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 20px; max-width: 720px; width: 100%; align-self: center; }
.field { display: grid; gap: 8px; }
.lbl { font: 700 15px var(--display); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 44px; padding: 8px 14px; border-radius: 8px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-family: var(--display); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.names { display: grid; gap: 8px; }
.names input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); border-inline-start: 6px solid var(--pc); }

/* game */
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pl { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 2px solid transparent; background: var(--panel); font-weight: 700; }
.pl i { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); }
.pl b { font: 800 18px var(--display); font-variant-numeric: tabular-nums; }
.pl.now { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent); }
.status { font: 700 16px var(--display); color: var(--muted); margin-inline-start: auto; }
.board-area { flex: 1; display: flex; align-items: center; justify-content: center; min-height: 0; }
.grid { --cols: 4; --rows: 4; display: grid; grid-template-columns: repeat(var(--cols), 1fr); gap: clamp(6px, 1.2vw, 12px);
  width: min(100%, calc((100vh - 190px) * var(--cols) / var(--rows) * .78)); min-width: 200px; }
.card { aspect-ratio: 4 / 5; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: 12px; }
.card .in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.card.up .in, .card.done .in { transform: rotateY(180deg); }
.card .f, .card .b { position: absolute; inset: 0; border-radius: 12px; backface-visibility: hidden; display: grid; place-items: center; }
.card .b { background: repeating-linear-gradient(45deg, var(--back1) 0 10px, var(--back2) 10px 20px); box-shadow: 0 2px 6px rgb(0 0 0 / .18); }
.card .b::after { content: "?"; font: 800 clamp(20px, 4vw, 40px) var(--display); color: rgb(255 255 255 / .55); }
.card .f { background: var(--face); border: 2px solid var(--line); transform: rotateY(180deg); font-size: clamp(26px, 6vw, 64px); line-height: 1; }
.card.done .f { border-color: var(--pc, var(--good)); background: color-mix(in srgb, var(--pc, var(--good)) 14%, var(--face)); }
.card.done { cursor: default; }
@media (prefers-reduced-motion: reduce) { .card .in { transition: none; } }

.card.used .f { border-style: dashed; border-color: var(--line); background: var(--bg); opacity: .55; }
.card.sp .f { border-color: var(--accent); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.card.moved .b { outline: 4px solid #f2b705; outline-offset: -4px; }
@media (prefers-reduced-motion: no-preference) {
  .card.moved .in { animation: wig .6s ease-in-out 2; }
  .card.got .in { animation: pop .5s ease-out; }
}
@keyframes wig { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes pop { 50% { transform: rotateY(180deg) scale(1.12); } }
.msg { font: 800 clamp(16px, 2.4vw, 20px) var(--display); text-align: center; min-height: 1.6em; color: var(--accent); margin: 0; }

/* end dialog */
.veil { position: fixed; inset: 0; background: rgb(10 8 20 / .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dlg { background: var(--panel); border-radius: 14px; padding: 20px; width: min(640px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 12px; }
.dlg h2 { font: 800 20px var(--display); margin: 0; }
.rank { display: grid; gap: 6px; }
.rank .pl { justify-content: space-between; }
.big { font-size: 56px; text-align: center; line-height: 1; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🃏 זיכרון</h1>
    <div class="row">
      <button class="btn ghost" id="newBtn" type="button" hidden>משחק חדש</button>
      <a class="back" href="index.html" target="_top">← לתפריט</a>
    </div>
  </div>

  <section class="setup" id="setup">
    <div class="field">
      <span class="lbl">מספר שחקנים</span>
      <div class="seg" id="count"></div>
    </div>
    <div class="field">
      <span class="lbl">שמות</span>
      <div class="names" id="names"></div>
    </div>
    <div class="field">
      <span class="lbl">גודל הלוח</span>
      <div class="seg" id="size"></div>
    </div>
    <div class="field">
      <span class="lbl">סוג הזוגות</span>
      <div class="seg" id="kind"></div>
      <p class="hint" id="kindHint"></p>
    </div>
    <div class="field">
      <span class="lbl">קלפים מיוחדים</span>
      <div class="seg" id="special"></div>
      <p class="hint" id="specialHint"></p>
    </div>
    <div class="row"><button class="btn" id="startBtn" type="button">התחלת משחק</button></div>
  </section>

  <section id="game" hidden style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
    <div class="bar" id="bar"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="board-area"><div class="grid" id="grid"></div></div>
  </section>
</div>

<div class="veil" id="veil" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
const SIZES = [{ n: 12, cols: 4, rows: 3, label: "קטן · 12" }, { n: 16, cols: 4, rows: 4, label: "בינוני · 16" },
               { n: 20, cols: 5, rows: 4, label: "גדול · 20" }, { n: 30, cols: 6, rows: 5, label: "ענק · 30" }];
const KINDS = [{ id: "same", label: "זוגות זהים", hint: "מחפשים שני קלפים זהים." },
               { id: "smart", label: "זוגות חכמים", hint: "מחפשים שני קלפים שהולכים יחד: 🔑 עם 🔒, 🐝 עם 🍯, 🐛 עם 🦋. צריך לזכור וגם לחשוב." }];
const SPECIALS = [{ id: false, label: "בלי" }, { id: true, label: "עם קלפים מיוחדים" }];
const SPECIAL_HINT = "🔍 הצצה: כל הקלפים נפתחים לרגע.  🌀 ערבוב: כמה קלפים סגורים מחליפים מקום.  🃏 ג'וקר: מתאים לכל קלף, ומקבלים את הזוג שלו.  קלף 🔍 או 🌀 לא מסיים את התור: ממשיכים להפוך.";
const SAME = "🦁🐘🦒🐢🐙🦋🐝🦉🐧🦊🐸🐳🦓🦜🐌🦔🍉🍋🍇🍓🥑🍕🧁🍩🌵🌻🍄⭐🌈🔥⚽🎸🎈🚀⛵🚲🎩👑🔑⏰💡🎲🧩🪁🏰🗿🎻🧸".match(/\p{Extended_Pictographic}/gu);
// related pairs; no emoji appears twice, and none sits too close to another pair
const SMART = [["🔑", "🔒"], ["🐝", "🍯"], ["🐄", "🥛"], ["🐑", "🧶"], ["🌧️", "☂️"], ["⚽", "🥅"], ["🪡", "🧵"], ["🖌️", "🎨"],
  ["🐒", "🍌"], ["🐰", "🥕"], ["🐶", "🦴"], ["🦷", "🪥"], ["🪛", "🔩"], ["🧦", "👟"], ["🚀", "🌕"], ["⛵", "🌊"],
  ["🍿", "🎬"], ["📮", "✉️"], ["🌱", "🌳"], ["🐛", "🦋"], ["🔦", "🔋"], ["🥣", "🥄"], ["❄️", "⛄"], ["💍", "💒"],
  ["🐣", "🥚"], ["🏹", "🎯"], ["🎂", "🕯️"], ["🧲", "📎"]];
// special cards per board size (kept even so the regular cards still make whole pairs)
const SP_SET = { 12: ["peek", "joker"], 16: ["peek", "shuffle", "joker", "peek"], 20: ["peek", "shuffle", "joker", "peek"], 30: ["peek", "shuffle", "joker", "peek", "shuffle", "joker"] };
const SP_FACE = { peek: "🔍", shuffle: "🌀", joker: "🃏" };
const LS = "memory-setup-v2";

let setup = { count: 2, names: ["", "", "", ""], size: 1, kind: "same", special: true };
try { Object.assign(setup, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
let G = null, msgTimer = 0;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nameOf = i => setup.names[i].trim() || `שחקן ${i + 1}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- sound ----------
let ac = null;
function beep(freqs, dur = .12, type = "sine") {
  try {
    ac ||= new AudioContext();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur * .95);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    });
  } catch (e) {}
}
const sFlip = () => beep([520], .06, "triangle"), sPair = () => beep([660, 880], .1), sMagic = () => beep([880, 1175, 1568], .08),
      sSwirl = () => beep([400, 520, 400, 520], .07, "triangle"), sMiss = () => beep([300, 240], .12, "triangle");

// ---------- setup ----------
function seg(el, items, current, pick) {
  el.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = it.label; b.setAttribute("aria-pressed", it.value === current);
    b.onclick = () => { pick(it.value); renderSetup(); };
    el.append(b);
  });
}
function renderSetup() {
  seg($("count"), [1, 2, 3, 4].map(n => ({ label: n, value: n })), setup.count, v => setup.count = v);
  $("names").innerHTML = "";
  for (let i = 0; i < setup.count; i++) {
    const inp = document.createElement("input");
    inp.placeholder = `שחקן ${i + 1}`; inp.value = setup.names[i]; inp.maxLength = 16;
    inp.style.setProperty("--pc", COLORS[i]); inp.setAttribute("aria-label", `שם שחקן ${i + 1}`);
    inp.oninput = () => { setup.names[i] = inp.value; };
    $("names").append(inp);
  }
  seg($("size"), SIZES.map((s, i) => ({ label: s.label, value: i })), setup.size, v => setup.size = v);
  seg($("kind"), KINDS.map(k => ({ label: k.label, value: k.id })), setup.kind, v => setup.kind = v);
  $("kindHint").textContent = KINDS.find(k => k.id === setup.kind).hint;
  seg($("special"), SPECIALS.map(s => ({ label: s.label, value: s.id })), setup.special, v => setup.special = v);
  $("specialHint").textContent = setup.special ? SPECIAL_HINT : "";
  $("specialHint").hidden = !setup.special;
}

function deal() {
  const S = SIZES[setup.size], sps = setup.special ? SP_SET[S.n] : [], pairs = (S.n - sps.length) / 2;
  const cards = [];
  if (setup.kind === "smart") shuffle([...SMART]).slice(0, pairs).forEach((p, k) => p.forEach(f => cards.push({ f, k })));
  else shuffle([...SAME]).slice(0, pairs).forEach((f, k) => cards.push({ f, k }, { f, k }));
  sps.forEach((sp, i) => cards.push({ f: SP_FACE[sp], k: "sp" + i, sp }));
  return shuffle(cards).map(c => ({ ...c, up: false, owner: -1 }));
}

function start() {
  try { localStorage.setItem(LS, JSON.stringify(setup)); } catch (e) {}
  const S = SIZES[setup.size];
  G = { cards: deal(), players: Array.from({ length: setup.count }, (_, i) => ({ name: nameOf(i), pairs: 0 })),
        turn: 0, open: [], lock: false, moves: 0, peek: false };
  $("setup").hidden = true; $("game").hidden = false; $("newBtn").hidden = false; $("msg").textContent = "";
  const grid = $("grid");
  grid.style.setProperty("--cols", S.cols); grid.style.setProperty("--rows", S.rows);
  grid.innerHTML = "";
  G.cards.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card";
    b.innerHTML = `<div class="in"><div class="b"></div><div class="f"></div></div>`;
    b.onclick = () => flip(i);
    grid.append(b);
  });
  render();
}

// ---------- play ----------
function say(text, ms = 2200) {
  clearTimeout(msgTimer); $("msg").textContent = text;
  if (ms) msgTimer = setTimeout(() => $("msg").textContent = "", ms);
}
function render() {
  $("bar").innerHTML = G.players.map((p, i) =>
    `<span class="pl${i === G.turn ? " now" : ""}" style="--pc:${COLORS[i]}"><i></i>${esc(p.name)} <b>${p.pairs}</b></span>`).join("") +
    `<span class="status">${G.players.length === 1 ? `מהלכים: ${G.moves}` : `התור של ${esc(G.players[G.turn].name)}`}</span>`;
  [...$("grid").children].forEach((el, i) => {
    const c = G.cards[i], shown = c.up || c.owner !== -1 || (G.peek && !c.sp);
    el.querySelector(".f").textContent = c.f;
    el.classList.toggle("up", shown);
    el.classList.toggle("done", c.owner >= 0);
    el.classList.toggle("used", c.owner === -2);
    el.classList.toggle("sp", !!c.sp && c.owner === -1);
    if (c.owner >= 0) el.style.setProperty("--pc", COLORS[c.owner]); else el.style.removeProperty("--pc");
    el.setAttribute("aria-label", shown ? c.f : "קלף הפוך");
    el.disabled = c.owner !== -1;
  });
}
const closedRegular = () => G.cards.map((c, i) => i).filter(i => G.cards[i].owner === -1 && !G.cards[i].up && !G.cards[i].sp);
const flash = (idx, cls, ms) => { idx.forEach(i => $("grid").children[i].classList.add(cls)); setTimeout(() => idx.forEach(i => $("grid").children[i]?.classList.remove(cls)), ms); };

async function flip(i) {
  const c = G.cards[i];
  if (G.lock || c.up || c.owner !== -1) return;
  c.up = true; sFlip(); render();

  if (c.sp === "peek" || c.sp === "shuffle") {
    G.lock = true;
    await sleep(500);
    c.owner = -2; c.up = false;
    if (c.sp === "peek") {
      sMagic(); say("🔍 הצצה! כל הקלפים נפתחים לרגע…", 2600);
      G.peek = true; render(); await sleep(1600); G.peek = false;
    } else {
      const pick = shuffle(closedRegular()).slice(0, 6);
      if (pick.length > 1) {
        const moved = shuffle(pick.map(k => G.cards[k]));
        pick.forEach((k, n) => G.cards[k] = moved[n]);
        sSwirl(); say("🌀 ערבוב! הקלפים המסומנים החליפו מקומות ביניהם", 2600);
        flash(pick, "moved", 1300);
      } else say("🌀 ערבוב! אבל לא נשארו מספיק קלפים לערבב", 2200);
    }
    G.lock = false; render();
    return checkEnd();
  }

  G.open.push(i);
  if (G.open.length < 2) return;
  G.moves++; G.lock = true;
  const [a, b] = G.open.map(k => G.cards[k]);
  await sleep(550);
  if (a.sp === "joker" || b.sp === "joker") return jokerPair(a, b);
  if (a.k === b.k) {
    sPair();
    if (setup.kind === "smart") say(`${a.f} הולך עם ${b.f}`);
    return take(G.open);
  }
  await sleep(550);
  sMiss(); a.up = b.up = false; G.open = []; G.turn = (G.turn + 1) % G.players.length; G.lock = false; render();
}

// a joker takes the other card and that card's partner, wherever it is on the board
async function jokerPair(a, b) {
  const other = a.sp === "joker" ? b : a;
  const idx = [...G.open];
  if (other.sp !== "joker") {
    const twin = G.cards.findIndex(c => c !== other && c.k === other.k && c.owner === -1);
    if (twin >= 0) { G.cards[twin].up = true; idx.push(twin); render(); await sleep(700); }
    say(`🃏 ג'וקר! קיבלת את ${other.f} ואת בן הזוג שלו`, 2600);
  } else say("🃏🃏 שני ג'וקרים! זוג בשבילך", 2400);
  sMagic();
  take(idx);
}

function take(idx) {
  idx.forEach(k => { G.cards[k].owner = G.turn; G.cards[k].up = false; });
  flash(idx, "got", 600);
  G.players[G.turn].pairs++; G.open = []; G.lock = false; render();
  checkEnd();
}

function checkEnd() {
  if (G.cards.some(c => c.owner === -1 && !c.sp)) return;
  G.cards.forEach(c => { if (c.owner === -1) c.owner = -2; });
  G.lock = true; render();
  setTimeout(finish, 700);
}

function finish() {
  const ps = G.players.map((p, i) => ({ ...p, i })).sort((a, b) => b.pairs - a.pairs);
  const solo = G.players.length === 1, top = ps[0].pairs, winners = ps.filter(p => p.pairs === top);
  const title = solo ? `סיימת ב-${G.moves} מהלכים!` : winners.length > 1 ? "תיקו!" : `${esc(winners[0].name)} ניצח/ה!`;
  $("dlg").innerHTML = `
    <div class="big">🏆</div><h2 style="text-align:center">${title}</h2>
    <div class="rank">${ps.map(p => `<span class="pl" style="--pc:${COLORS[p.i]}"><span><i style="display:inline-block;margin-inline-end:8px"></i>${esc(p.name)}</span><b>${p.pairs} זוגות</b></span>`).join("")}</div>
    <div class="row"><button class="btn" type="button" id="again">עוד משחק</button><button class="btn ghost" type="button" id="toSetup">הגדרות</button></div>`;
  $("veil").hidden = false;
  beep([523, 659, 784, 1047], .14);
  $("again").focus();
  $("again").onclick = () => { $("veil").hidden = true; start(); };
  $("toSetup").onclick = toSetup;
}

function toSetup() { $("veil").hidden = true; $("game").hidden = true; $("setup").hidden = false; $("newBtn").hidden = true; G = null; renderSetup(); }
$("newBtn").onclick = toSetup;
$("startBtn").onclick = start;
renderSetup();
</script>
</body>
</html>
