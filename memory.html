<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>זיכרון</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Memory card game. Pairs are identical or "smart" (two things that go together),
   and optional special cards give a peek (wave / sparkle / flash) or shuffle some closed cards. */
:root {
  --bg: #f1f0f7; --panel: #fcfcfe; --ink: #1d1b2c; --muted: #625f78; --line: #d6d4e3;
  --accent: #5b3fc4; --accent-ink: #ffffff;
  --back1: #5b3fc4; --back2: #7d63e0; --face: #ffffff;
  --good: #1d7a46; --good-soft: #def2e5; --bad: #b3261e; --bad-soft: #f8e2df;
  --p1: #d64545; --p2: #2f6fd6; --p3: #c98f00; --p4: #2e9a5a;
  --display: "Rubik", "Segoe UI", Arial, sans-serif;
  --body: "Assistant", "Segoe UI", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13121c; --panel: #1c1a28; --ink: #e8e6f3; --muted: #a29fba; --line: #312e44;
    --accent: #a08cf5; --accent-ink: #15121f; --back1: #4a33a8; --back2: #6a52cc; --face: #26233a;
    --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
    --p1: #e05a5a; --p2: #4f86e8; --p3: #e0b030; --p4: #44b070; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13121c; --panel: #1c1a28; --ink: #e8e6f3; --muted: #a29fba; --line: #312e44;
  --accent: #a08cf5; --accent-ink: #15121f; --back1: #4a33a8; --back2: #6a52cc; --face: #26233a;
  --good: #5cc48a; --good-soft: #17301f; --bad: #f08a80; --bad-soft: #3a1f1d;
  --p1: #e05a5a; --p2: #4f86e8; --p3: #e0b030; --p4: #44b070; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.5; direction: rtl; }
.wrap {
  max-width: 1100px; margin: 0 auto; padding-block: 12px 24px; min-height: 100%;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 800; font-size: clamp(22px, 4vw, 32px); margin: 0; }
.back { color: var(--accent); font-weight: 700; text-decoration: none; }
button, input { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, .card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.btn { font: 700 16px var(--body); padding: 10px 20px; border-radius: 8px; cursor: pointer; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

/* setup */
.setup { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 22px; display: grid; gap: 20px; max-width: 720px; width: 100%; align-self: center; }
.field { display: grid; gap: 8px; }
.lbl { font: 700 15px var(--display); }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { min-width: 44px; padding: 8px 14px; border-radius: 8px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-family: var(--display); font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.names { display: grid; gap: 8px; }
.names input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--bg); border-inline-start: 6px solid var(--pc); }

/* game */
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pl { display: flex; align-items: center; gap: 8px; padding: 4px 12px; border-radius: 999px; border: 2px solid transparent; background: var(--panel); font-weight: 700; }
.pl i { width: 12px; height: 12px; border-radius: 50%; background: var(--pc); }
.pl b { font: 800 18px var(--display); font-variant-numeric: tabular-nums; }
.pl.now { border-color: var(--pc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--pc) 25%, transparent); }
.status { font: 700 16px var(--display); color: var(--muted); margin-inline-start: auto; }
.board-area { flex: 1; display: flex; align-items: flex-start; justify-content: center; min-height: 0; }
/* columns, card width (--cw) and gap are set by layout() to fit the window */
.grid { --cols: 4; --cw: 100px; --gap: 10px; display: grid; grid-template-columns: repeat(var(--cols), var(--cw)); gap: var(--gap); }
.card { width: var(--cw); aspect-ratio: 4 / 5; perspective: 800px; border: 0; padding: 0; background: none; cursor: pointer; border-radius: calc(var(--cw) * .12); }
.card .in { position: relative; width: 100%; height: 100%; transition: transform .45s; transform-style: preserve-3d; }
.grid.quick .card .in { transition-duration: .22s; }
.card.up .in, .card.done .in, .card.peek .in { transform: rotateY(180deg); }
.card .f, .card .b { position: absolute; inset: 0; border-radius: inherit; backface-visibility: hidden; display: grid; place-items: center; }
.card .b { background: repeating-linear-gradient(45deg, var(--back1) 0 calc(var(--cw) * .1), var(--back2) 0 calc(var(--cw) * .2)); box-shadow: 0 2px 6px rgb(0 0 0 / .18); }
.card .b::after { content: "?"; font: 800 calc(var(--cw) * .36) var(--display); color: rgb(255 255 255 / .55); }
.card .f { background: var(--face); border: 2px solid var(--line); transform: rotateY(180deg); font-size: calc(var(--cw) * .58); line-height: 1; }
.card.done .f { border-color: var(--pc, var(--good)); background: color-mix(in srgb, var(--pc, var(--good)) 14%, var(--face)); }
.card.done { cursor: default; }
@media (prefers-reduced-motion: reduce) { .card .in { transition: none; } }

.card.used .f { border-style: dashed; border-color: var(--line); background: var(--bg); opacity: .55; }
.card.sp .f { border-color: var(--accent); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--accent) 30%, transparent); }
.card.moved .b { outline: 4px solid #f2b705; outline-offset: -4px; }
@media (prefers-reduced-motion: no-preference) {
  .card.moved .in { animation: wig .6s ease-in-out 2; }
  .card.got .in { animation: pop .5s ease-out; }
  .card.got.peek .in, .card.moved.peek .in { animation: none; }
}
@keyframes wig { 25% { transform: rotate(-6deg); } 75% { transform: rotate(6deg); } }
@keyframes pop { 50% { transform: rotateY(180deg) scale(1.12); } }
.msg { font: 800 clamp(16px, 2.4vw, 20px) var(--display); text-align: center; min-height: 1.6em; color: var(--accent); margin: 0; }

/* end dialog */
.veil { position: fixed; inset: 0; background: rgb(10 8 20 / .55); display: grid; place-items: center; padding: 16px; z-index: 10; }
.dlg { background: var(--panel); border-radius: 14px; padding: 20px; width: min(780px, 100%); max-height: calc(100vh - 32px); overflow: auto; display: grid; gap: 12px; }
.dlg h2 { font: 800 20px var(--display); margin: 0; }
.rank { display: grid; gap: 6px; }
.rank .pl { justify-content: space-between; }
.big { font-size: 56px; text-align: center; line-height: 1; }
.clock { font: 800 18px var(--display); font-variant-numeric: tabular-nums; color: var(--ink); background: var(--panel); border-radius: 999px; padding: 4px 12px; }
.tbl { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 6px 8px; text-align: start; border-bottom: 1px solid var(--line); }
.tbl th { font: 700 13px var(--display); color: var(--muted); }
.tbl td b { font: 800 17px var(--display); }
.tbl .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--pc); margin-inline-end: 6px; }
.tblwrap { overflow-x: auto; }
.rec { color: var(--good); font-weight: 800; }
.tbl.log td { font-size: 13px; vertical-align: top; }
.tbl.log td b { font-size: 15px; }
.tbl.log td { white-space: nowrap; }
.tbl.log .kind { font: 700 13px var(--display); }
.tbl.log .why { color: var(--muted); font-size: 12px; }
.dlg select { font: inherit; padding: 2px 6px; }
.who { font: 800 15px var(--display); color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; }
.formula { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🃏 זיכרון</h1>
    <div class="row">
      <button class="btn ghost" id="newBtn" type="button" hidden>משחק חדש</button>
      <a class="back" href="index.html" target="_top">← לתפריט</a>
    </div>
  </div>

  <section class="setup" id="setup">
    <div class="field">
      <span class="lbl">מספר שחקנים</span>
      <div class="seg" id="count"></div>
    </div>
    <div class="field">
      <span class="lbl">שמות</span>
      <div class="names" id="names"></div>
      <p class="hint">כל שם שומר סטטיסטיקה משלו: משחקים, ניצחונות ושיאים.</p>
    </div>
    <div class="field">
      <span class="lbl">גודל הלוח</span>
      <div class="seg" id="size"></div>
    </div>
    <div class="field">
      <span class="lbl">סוג הזוגות</span>
      <div class="seg" id="kind"></div>
      <p class="hint" id="kindHint"></p>
    </div>
    <div class="field">
      <span class="lbl">קלפים מיוחדים</span>
      <div class="seg" id="special"></div>
      <p class="hint" id="specialHint"></p>
    </div>
    <div class="field">
      <span class="lbl">רמזים</span>
      <div class="seg" id="hints"></div>
      <p class="hint" id="hintsHint"></p>
    </div>
    <div class="row"><button class="btn" id="startBtn" type="button">התחלת משחק</button><button class="btn ghost" id="statsBtn" type="button">📊 סטטיסטיקה</button><button class="btn ghost" id="gamesBtn" type="button">📋 טבלת משחקים</button></div>
  </section>

  <section id="game" hidden style="display:flex;flex-direction:column;gap:10px;flex:1;min-height:0">
    <div class="bar" id="bar"></div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="board-area"><div class="grid" id="grid"></div></div>
  </section>
</div>

<div class="veil" id="veil" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true"></div></div>

<script>
const $ = id => document.getElementById(id);
const COLORS = ["var(--p1)", "var(--p2)", "var(--p3)", "var(--p4)"];
// board sizes in pairs; special cards come on top of these (sp = how many of each kind)
const SIZES = [{ pairs: 6, sp: 1, label: "קטן · 6 זוגות" }, { pairs: 10, sp: 1, label: "בינוני · 10 זוגות" },
               { pairs: 15, sp: 2, label: "גדול · 15 זוגות" }, { pairs: 24, sp: 2, label: "ענק · 24 זוגות" },
               { pairs: 50, sp: 4, label: "מפלצת · 50 זוגות" }];
const KINDS = [{ id: "same", label: "זוגות זהים", hint: "מחפשים שני קלפים זהים." },
               { id: "smart", label: "זוגות חכמים", hint: "מחפשים שני קלפים שהולכים יחד: 🔑 עם 🔒, 🐝 עם 🍯, 🐛 עם 🦋. צריך לזכור וגם לחשוב." }];
const SPECIALS = [{ id: false, label: "בלי" }, { id: true, label: "עם קלפים מיוחדים" }];
const SPECIAL_HINT = "🔍 הצצה: הקלפים מתהפכים לרגע ונסגרים, כל פעם בצורה אחרת (גל, נצנוץ, הבזק).  🌀 ערבוב: כמה קלפים סגורים מחליפים מקום.  קלף מיוחד לא מסיים את התור: ממשיכים להפוך.";
const SAME = "🦁🐘🦒🐢🐙🦋🐝🦉🐧🦊🐸🐳🦓🦜🐌🦔🍉🍋🍇🍓🥑🍕🧁🍩🌵🌻🍄⭐🌈🔥⚽🎸🎈🚀⛵🚲🎩👑🔑⏰💡🎲🧩🪁🏰🗿🎻🧸🐼🐨🦄🐞🦀🐬🍒🌽🍦🎁🛸🚁🎺🥁🎯🧲🌙🍀🦩🦚".match(/\p{Extended_Pictographic}/gu);
// related pairs; no emoji appears twice, and none sits too close to another pair
const SMART = [["🔑", "🔒"], ["🐝", "🍯"], ["🐄", "🥛"], ["🐑", "🧶"], ["🌧️", "☂️"], ["⚽", "🥅"], ["🪡", "🧵"], ["🖌️", "🎨"],
  ["🐒", "🍌"], ["🐰", "🥕"], ["🐶", "🦴"], ["🦷", "🪥"], ["🪛", "🔩"], ["🧦", "👟"], ["🚀", "🌕"], ["⛵", "🌊"],
  ["🍿", "🎬"], ["📮", "✉️"], ["🌱", "🌳"], ["🐛", "🦋"], ["🔦", "🔋"], ["🥣", "🥄"], ["❄️", "⛄"], ["💍", "💒"],
  ["🐣", "🥚"], ["🏹", "🎯"], ["🧲", "📎"], ["🐼", "🎋"], ["🐿️", "🌰"], ["🕷️", "🕸️"], ["🎣", "🐟"], ["✂️", "📄"],
  ["🚗", "⛽"], ["✈️", "🧳"], ["🎹", "🎼"], ["📷", "🖼️"], ["🧽", "🧼"], ["🌋", "🔥"], ["🐸", "🦟"], ["🦁", "👑"],
  ["🦉", "🌙"], ["🐫", "🏜️"], ["🐭", "🧀"], ["🐓", "🌅"], ["🕎", "🍩"], ["🍷", "🍇"], ["🍞", "🧈"], ["🍝", "🍅"],
  ["🍔", "🍟"], ["🥜", "🐘"], ["🧊", "🥤"], ["👓", "📖"], ["⏰", "🛏️"], ["🧤", "🧣"], ["🎁", "🎀"], ["🪁", "🌬️"],
  ["🚂", "🛤️"], ["🔭", "⭐"], ["🧭", "🗺️"], ["🩺", "❤️"], ["🏰", "👸"]];
const HINTS = [{ id: false, label: "בלי" }, { id: true, label: "מדי פעם" }];
const HINTS_HINT = "💡 אחרי כל 3 פספוסים, כמה קלפים נחשפים לרגע ונסגרים מייד. ביניהם תמיד זוג אחד שלם, למי שמספיק לקלוט.";
const HINT_EVERY = 3;
const SP_FACE = { peek: "🔍", shuffle: "🌀" };
const LS = "memory-setup-v3", LS_STATS = "memory-stats-v1";
// score: 100 per pair, minus 15 per miss (a lift of two cards that didn't match); a solo player also loses 2 per second
const PT_PAIR = 100, PT_MISS = 15, PT_SEC = 2;

let setup = { count: 2, names: ["", "", "", ""], size: 1, kind: "same", special: true, hints: true };
try { Object.assign(setup, JSON.parse(localStorage.getItem(LS) || "{}")); } catch (e) {}
let G = null, msgTimer = 0, clockTimer = 0;

const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nameOf = i => setup.names[i].trim() || `שחקן ${i + 1}`;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ---------- sound ----------
let ac = null;
function beep(freqs, dur = .12, type = "sine") {
  try {
    ac ||= new AudioContext();
    freqs.forEach((f, i) => {
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * dur;
      o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.12, t); g.gain.exponentialRampToValueAtTime(.001, t + dur * .95);
      o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur);
    });
  } catch (e) {}
}
// several little tunes for a found pair and for a miss; a random one each time, never the same twice running
const PAIR_TUNES = [
  () => beep([660, 880], .1),
  () => beep([523, 659, 784], .08),
  () => beep([784, 988, 1175, 1568], .06),
  () => beep([880, 1319], .12, "triangle"),
  () => beep([587, 740, 880, 1175], .07, "square"),
  () => beep([1047, 784, 1047, 1319], .07),
  () => beep([698, 880, 1047], .09, "triangle")];
const MISS_TUNES = [
  () => beep([300, 240], .12, "triangle"),
  () => beep([392, 330, 262], .1, "triangle"),
  () => beep([220, 220], .1, "square"),
  () => beep([440, 415, 392, 370], .08, "sawtooth"),
  () => beep([330, 247], .16),
  () => beep([262, 196], .14, "triangle")];
const lastTune = new Map();
const playOne = list => { let n; do n = Math.random() * list.length | 0; while (list.length > 1 && n === lastTune.get(list)); lastTune.set(list, n); list[n](); };
const sFlip = () => beep([520], .06, "triangle"), sPair = () => playOne(PAIR_TUNES), sMagic = () => beep([880, 1175, 1568], .08),
      sSwirl = () => beep([400, 520, 400, 520], .07, "triangle"), sMiss = () => playOne(MISS_TUNES);

// ---------- setup ----------
function seg(el, items, current, pick) {
  el.innerHTML = "";
  items.forEach(it => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = it.label; b.setAttribute("aria-pressed", it.value === current);
    b.onclick = () => { pick(it.value); renderSetup(); };
    el.append(b);
  });
}
function renderSetup() {
  seg($("count"), [1, 2, 3, 4].map(n => ({ label: n, value: n })), setup.count, v => setup.count = v);
  $("names").innerHTML = "";
  for (let i = 0; i < setup.count; i++) {
    const inp = document.createElement("input");
    inp.placeholder = `שחקן ${i + 1}`; inp.value = setup.names[i]; inp.maxLength = 16;
    inp.style.setProperty("--pc", COLORS[i]); inp.setAttribute("aria-label", `שם שחקן ${i + 1}`);
    inp.oninput = () => { setup.names[i] = inp.value; };
    $("names").append(inp);
  }
  seg($("size"), SIZES.map((s, i) => ({ label: s.label, value: i })), setup.size, v => setup.size = v);
  seg($("kind"), KINDS.map(k => ({ label: k.label, value: k.id })), setup.kind, v => setup.kind = v);
  $("kindHint").textContent = KINDS.find(k => k.id === setup.kind).hint;
  seg($("special"), SPECIALS.map(s => ({ label: s.label, value: s.id })), setup.special, v => setup.special = v);
  $("specialHint").textContent = setup.special ? SPECIAL_HINT : "";
  $("specialHint").hidden = !setup.special;
  seg($("hints"), HINTS.map(h => ({ label: h.label, value: h.id })), setup.hints, v => setup.hints = v);
  $("hintsHint").textContent = setup.hints ? HINTS_HINT : "";
  $("hintsHint").hidden = !setup.hints;
}

function deal() {
  const S = SIZES[setup.size], pairs = S.pairs, cards = [];
  const sps = setup.special ? Array.from({ length: S.sp }, () => ["peek", "shuffle"]).flat() : [];
  if (setup.kind === "smart") shuffle([...SMART]).slice(0, pairs).forEach((p, k) => p.forEach(f => cards.push({ f, k })));
  else shuffle([...SAME]).slice(0, pairs).forEach((f, k) => cards.push({ f, k }, { f, k }));
  sps.forEach((sp, i) => cards.push({ f: SP_FACE[sp], k: "sp" + i, sp }));
  return shuffle(cards).map(c => ({ ...c, up: false, owner: -1 }));
}

function start() {
  try { localStorage.setItem(LS, JSON.stringify(setup)); } catch (e) {}
  clearInterval(clockTimer);
  G = { cards: deal(), players: Array.from({ length: setup.count }, (_, i) => ({ name: nameOf(i), named: !!setup.names[i].trim(), pairs: 0, moves: 0, time: 0 })),
        turn: 0, open: [], lock: false, moves: 0, misses: 0, peekSet: new Set(), peekStyle: -1, t0: 0, t1: 0, turnT0: 0 };
  clockTimer = setInterval(tick, 500);
  $("setup").hidden = true; $("game").hidden = false; $("newBtn").hidden = false; $("msg").textContent = "";
  const grid = $("grid");
  grid.innerHTML = "";
  G.cards.forEach((c, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "card";
    b.innerHTML = `<div class="in"><div class="b"></div><div class="f"></div></div>`;
    b.onclick = () => flip(i);
    grid.append(b);
  });
  render(); layout();
  opening();
}

// Opening peek: before the first turn every regular card lies open for a few seconds
// (longer on bigger boards), with a countdown, then they all close. The clock waits.
async function opening() {
  const g = G, idx = closedRegular(), secs = Math.round(Math.min(8, Math.max(3, 2 + SIZES[setup.size].pairs * .15)));
  g.lock = true;
  await sleep(350); if (G !== g) return;
  idx.forEach(i => g.peekSet.add(i)); sMagic(); render();
  for (let s = secs; s > 0; s--) { say(`👀 תסתכלו טוב! הקלפים ייסגרו בעוד ${s}…`, 0); await sleep(1000); if (G !== g) return; }
  g.peekSet.clear(); render(); say("יאללה, מתחילים!", 1500);
  await sleep(500); if (G !== g) return;
  g.lock = false;
}

// picks the column count that gives the biggest cards in the space left under the bar
function layout() {
  if (!G) return;
  const grid = $("grid"), n = G.cards.length, area = grid.parentElement;
  const W = area.clientWidth, H = Math.max(160, innerHeight - area.getBoundingClientRect().top - 30);
  const gap = n > 60 ? 4 : n > 30 ? 6 : 10;
  let best = { cw: 0, cols: 4 };
  for (let cols = 2; cols <= n; cols++) {
    const rows = Math.ceil(n / cols);
    const cw = Math.min((W - gap * (cols - 1)) / cols, ((H - gap * (rows - 1)) / rows) * .8);
    if (cw > best.cw) best = { cw, cols };
  }
  grid.style.setProperty("--cols", best.cols);
  grid.style.setProperty("--cw", Math.floor(best.cw) + "px");
  grid.style.setProperty("--gap", gap + "px");
}
addEventListener("resize", layout);

// ---------- play ----------
function say(text, ms = 2200) {
  clearTimeout(msgTimer); $("msg").textContent = text;
  if (ms) msgTimer = setTimeout(() => $("msg").textContent = "", ms);
}
function render() {
  $("bar").innerHTML = G.players.map((p, i) =>
    `<span class="pl${i === G.turn ? " now" : ""}" style="--pc:${COLORS[i]}"><i></i>${esc(p.name)} <b>${p.pairs}</b></span>`).join("") +
    `<span class="status">${G.players.length === 1 ? `הרמות: ${G.moves}` : `התור של ${esc(G.players[G.turn].name)}`}</span>` +
    (solo() ? `<span class="clock" id="clock">⏱ ${fmt(elapsed())}</span>` : "");
  [...$("grid").children].forEach((el, i) => {
    const c = G.cards[i], shown = c.up || c.owner !== -1;
    el.querySelector(".f").textContent = c.f;
    el.classList.toggle("up", shown);
    el.classList.toggle("peek", G.peekSet.has(i));
    el.classList.toggle("done", c.owner >= 0);
    el.classList.toggle("used", c.owner === -2);
    el.classList.toggle("sp", !!c.sp && c.owner === -1);
    if (c.owner >= 0) el.style.setProperty("--pc", COLORS[c.owner]); else el.style.removeProperty("--pc");
    el.setAttribute("aria-label", shown ? c.f : "קלף הפוך");
    el.disabled = c.owner !== -1;
  });
}
// ---------- clock & score ----------
const elapsed = () => !G || !G.t0 ? 0 : (G.t1 || Date.now()) - G.t0;
const fmt = ms => { const s = Math.floor(ms / 1000); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
function tick() { if (G && $("clock")) $("clock").textContent = "⏱ " + fmt(elapsed()); }
// charges the time since the turn began to the player whose turn it is
function charge() { if (!G.t0) return; const now = Date.now(); G.players[G.turn].time += now - G.turnT0; G.turnT0 = now; }
const solo = () => G.players.length === 1;   // the clock only counts when playing alone
const scoreOf = p => Math.max(0, p.pairs * PT_PAIR - (p.moves - p.pairs) * PT_MISS - (solo() ? Math.round(p.time / 1000) * PT_SEC : 0));

const closedRegular = () => G.cards.map((c, i) => i).filter(i => G.cards[i].owner === -1 && !G.cards[i].up && !G.cards[i].sp);
const flash = (idx, cls, ms) => { idx.forEach(i => $("grid").children[i].classList.add(cls)); setTimeout(() => idx.forEach(i => $("grid").children[i]?.classList.remove(cls)), ms); };

async function flip(i) {
  const c = G.cards[i];
  if (G.lock || c.up || c.owner !== -1) return;
  if (!G.t0) G.t0 = G.turnT0 = Date.now();   // the clock starts with the first card
  c.up = true; sFlip(); render();

  if (c.sp === "peek" || c.sp === "shuffle") {
    G.lock = true;
    await sleep(500);
    c.owner = -2; c.up = false;
    if (c.sp === "peek") {
      await peek();
    } else {
      const pick = shuffle(closedRegular()).slice(0, 6);
      if (pick.length > 1) {
        const moved = shuffle(pick.map(k => G.cards[k]));
        pick.forEach((k, n) => G.cards[k] = moved[n]);
        sSwirl(); say("🌀 ערבוב! הקלפים המסומנים החליפו מקומות ביניהם", 2600);
        flash(pick, "moved", 1300);
      } else say("🌀 ערבוב! אבל לא נשארו מספיק קלפים לערבב", 2200);
    }
    G.lock = false; render();
    return checkEnd();
  }

  G.open.push(i);
  if (G.open.length < 2) return;
  G.moves++; G.players[G.turn].moves++; G.lock = true;
  const [a, b] = G.open.map(k => G.cards[k]);
  await sleep(550);
  if (a.k === b.k) {
    sPair();
    if (setup.kind === "smart") say(`${a.f} הולך עם ${b.f}`);
    return take(G.open);
  }
  await sleep(550);
  sMiss(); a.up = b.up = false; G.open = []; charge(); G.turn = (G.turn + 1) % G.players.length; render();
  if (setup.hints && ++G.misses % HINT_EVERY === 0) { await sleep(450); await hint(); G.turnT0 = Date.now(); }
  G.lock = false; render();
}

// Hint: a handful of closed cards (always including one whole pair) blink open and
// straight back, so a sharp eye can catch them.
async function hint() {
  const idx = closedRegular();
  if (idx.length < 4) return;
  const first = idx[Math.random() * idx.length | 0];
  const mate = idx.find(i => i !== first && G.cards[i].k === G.cards[first].k);
  const n = Math.min(idx.length, Math.max(4, Math.min(10, Math.round(idx.length / 5))));
  const rest = shuffle(idx.filter(i => i !== first && i !== mate)).slice(0, n - 2);
  const show = [first, mate, ...rest].filter(i => i !== undefined);
  beep([988, 1319], .07); say("💡 רמז! תסתכלו טוב…", 1800);
  $("grid").classList.add("quick");
  show.forEach(i => G.peekSet.add(i)); render();
  await sleep(750);
  G.peekSet.clear(); render();
  await sleep(300);
  $("grid").classList.remove("quick");
}

// Peek: the closed cards flip open and shut again, each one for a moment, in one of
// three patterns, never the same pattern twice in a row:
//   wave    a sweep across the board, column by column
//   sparkle random cards blink open in a quick scattered order
//   flash   everything opens at once, briefly
const PEEKS = [
  { id: "wave", text: "🔍 הצצה בגל! הקלפים מתהפכים לאורך הלוח" },
  { id: "sparkle", text: "🔍 הצצה מנצנצת! קלפים נפתחים ונסגרים בפיזור" },
  { id: "flash", text: "🔍 הבזק! הכול נפתח לרגע קצר" }];
async function peek() {
  let s; do s = Math.random() * PEEKS.length | 0; while (s === G.peekStyle); G.peekStyle = s;
  const P = PEEKS[s], idx = closedRegular(), cols = +$("grid").style.getPropertyValue("--cols") || 4;
  sMagic(); say(P.text, 3000);
  const plan = [];   // [card index, open at ms, open for ms]
  if (P.id === "wave") {
    const step = Math.max(70, Math.min(200, 1500 / cols));
    idx.forEach(i => plan.push([i, (i % cols) * step + Math.floor(i / cols) * 25, 950]));
  } else if (P.id === "sparkle") {
    const gap = Math.max(25, Math.min(160, 2000 / idx.length));
    shuffle([...idx]).forEach((i, n) => plan.push([i, n * gap, 750]));
  } else idx.forEach(i => plan.push([i, 0, 1000]));
  $("grid").classList.add("quick");
  const end = Math.max(0, ...plan.map(([, t, d]) => t + d));
  plan.forEach(([i, t, d]) => {
    setTimeout(() => { G.peekSet.add(i); render(); }, t);
    setTimeout(() => { G.peekSet.delete(i); render(); }, t + d);
  });
  await sleep(end + 300);
  G.peekSet.clear(); $("grid").classList.remove("quick");
}

function take(idx) {
  idx.forEach(k => { G.cards[k].owner = G.turn; G.cards[k].up = false; });
  flash(idx, "got", 600);
  G.players[G.turn].pairs++; G.open = []; G.lock = false; render();
  checkEnd();
}

function checkEnd() {
  if (G.cards.some(c => c.owner === -1 && !c.sp)) return;
  G.cards.forEach(c => { if (c.owner === -1) c.owner = -2; });
  charge(); G.t1 = Date.now(); clearInterval(clockTimer);
  G.lock = true; render();
  setTimeout(finish, 700);
}

function finish() {
  const ps = G.players.map((p, i) => ({ ...p, i, score: scoreOf(p) })).sort((a, b) => b.score - a.score || b.pairs - a.pairs);
  const solo = G.players.length === 1, winners = ps.filter(p => p.score === ps[0].score && p.pairs === ps[0].pairs);
  const recs = saveStats(ps, solo, winners);
  logGames(ps, solo, winners);
  const title = solo ? `סיימת ב-${fmt(elapsed())} עם ${G.moves} הרמות!` : winners.length > 1 ? "תיקו!" : `${esc(winners[0].name)} ניצח/ה!`;
  $("dlg").innerHTML = `
    <div class="big">🏆</div><h2 style="text-align:center">${title}</h2>
    <div class="tblwrap"><table class="tbl"><thead><tr><th>שחקן</th><th>זוגות</th><th>הרמות</th>${solo ? "<th>זמן</th>" : ""}<th>ציון</th></tr></thead><tbody>
    ${ps.map(p => `<tr style="--pc:${COLORS[p.i]}"><td><span class="dot"></span>${esc(p.name)}</td><td>${p.pairs}</td><td>${p.moves}</td>${solo ? `<td>${fmt(p.time)}</td>` : ""}
      <td><b>${p.score}</b>${recs.has(p.i) ? ` <span class="rec">🏅 שיא אישי!</span>` : ""}</td></tr>`).join("")}
    </tbody></table></div>
    <p class="formula">ציון: ${PT_PAIR} לכל זוג, פחות ${PT_MISS} לכל הרמה שלא מצאה זוג${solo ? `, פחות ${PT_SEC} לכל שנייה` : " · בלי שעון כשמשחקים כמה שחקנים"}</p>
    <div class="row"><button class="btn" type="button" id="again">עוד משחק</button><button class="btn ghost" type="button" id="toSetup">הגדרות</button><button class="btn ghost" type="button" id="endStats">📊 סטטיסטיקה</button></div>`;
  $("veil").hidden = false;
  beep([523, 659, 784, 1047], .14);
  $("again").focus();
  $("again").onclick = () => { $("veil").hidden = true; start(); };
  $("toSetup").onclick = toSetup;
  $("endStats").onclick = showStats;
}

// ---------- stats per name (kept in this browser) ----------
function loadStats() { try { return JSON.parse(localStorage.getItem(LS_STATS) || "{}"); } catch (e) { return {}; } }
// ---------- games table: one row per player per game, every game (named or not) ----------
const LS_GAMES = "memory-games-v1", GAMES_MAX = 1000;
function loadGames() {
  let list = null;
  try { list = JSON.parse(localStorage.getItem(LS_GAMES) || "null"); } catch (e) {}
  if (!Array.isArray(list)) {   // first run: bring in the solo games already kept per name
    list = [];
    Object.entries(loadStats()).forEach(([n, r]) => (r.log || []).filter(g => g.ms !== undefined).forEach(g => list.push({ d: g.d, n, k: g.k, pl: 1, m: g.m, x: g.m - g.p, p: g.p, ms: g.ms, t: g.ms, s: g.s })));
    list.sort((a, b) => a.d - b.d);
  }
  return list;
}
function logGames(ps, solo, winners) {
  const list = loadGames(), d = Date.now(), ms = elapsed(), k = `${setup.size}-${setup.kind}`;
  ps.forEach(p => list.push({ d, n: p.name, k, pl: ps.length, m: p.moves, x: p.moves - p.pairs, p: p.pairs, ms, t: p.time, s: p.score,
    w: !solo && winners.length === 1 && winners[0].i === p.i }));
  if (list.length > GAMES_MAX) list.splice(0, list.length - GAMES_MAX);
  try { localStorage.setItem(LS_GAMES, JSON.stringify(list)); } catch (e) {}
}
const boardKey = () => `${setup.size}-${setup.kind}`;
const boardName = key => { const [s, k, g] = key.split("-"); return `${SIZES[s]?.label || s}, ${KINDS.find(x => x.id === k)?.label || k}${g ? ", קבוצתי" : ""}`; };
// returns the set of player indexes who set a new personal best score on this board
function saveStats(ps, solo, winners) {
  const st = loadStats(), recs = new Set(), key = boardKey() + (solo ? "" : "-g");
  ps.filter(p => p.named).forEach(p => {
    const name = p.name.trim(), r = st[name] ||= { games: 0, wins: 0, pairs: 0, moves: 0, ms: 0, best: {} };
    r.games++; r.pairs += p.pairs; r.moves += p.moves; r.ms += p.time;
    if (!solo && winners.length === 1 && winners[0].i === p.i) r.wins++;
    const b = r.best[key] ||= {};
    if (b.score === undefined || p.score > b.score) { if (b.score !== undefined) recs.add(p.i); b.score = p.score; }
    if (solo && (b.ms === undefined || p.time < b.ms)) b.ms = p.time;
    if (solo && (b.moves === undefined || p.moves < b.moves)) b.moves = p.moves;
  });
  try { localStorage.setItem(LS_STATS, JSON.stringify(st)); } catch (e) {}
  return recs;
}
function showStats() {
  const games = loadGames(), st = loadStats(), names = Object.keys(st).sort((a, b) => st[b].games - st[a].games);
  const rows = names.map(n => {
    const r = st[n], acc = r.moves ? Math.round(100 * r.pairs / r.moves) : 0;
    const best = Object.entries(r.best).map(([k, b]) =>
      `<div>${esc(boardName(k))}: <b>${b.score}</b>${b.ms !== undefined ? ` · לבד ${fmt(b.ms)}, ${b.moves} הרמות` : ""}</div>`).join("");
    const log = games.filter(g => g.n === n && g.pl === 1), avg = log.length ? Math.round(log.reduce((t, g) => t + g.s, 0) / log.length) : "–";
    return `<tr><td><button class="who" type="button" data-n="${esc(n)}">${esc(n)}</button></td><td>${r.games}</td><td>${r.wins}</td><td>${acc}%</td><td>${log.length ? log[log.length - 1].s : "–"}</td><td>${avg}</td><td>${fmt(r.ms)}</td><td style="font-size:13px">${best}</td></tr>`;
  }).join("");
  $("dlg").innerHTML = `
    <h2>📊 סטטיסטיקה לפי שם</h2>
    ${names.length ? `<div class="tblwrap"><table class="tbl"><thead><tr><th>שם</th><th>משחקים</th><th>ניצחונות</th><th>דיוק</th><th>ציון אחרון (לבד)</th><th>ממוצע (לבד)</th><th>זמן משחק</th><th>שיאים (ציון)</th></tr></thead><tbody>${rows}</tbody></table></div>
    <p class="hint">לחיצה על שם פותחת את טבלת המשחקים שלו. דיוק = כמה מההרמות מצאו זוג. נשמר בדפדפן הזה בלבד. משחק בלי שם לא נספר.</p>`
    : `<p class="hint">עוד אין נתונים. כתבו שם לפני המשחק, והתוצאות יישמרו כאן.</p>`}
    <div class="row"><button class="btn" type="button" id="statsClose">סגירה</button><button class="btn ghost" type="button" id="statsGames">📋 טבלת משחקים</button>${names.length ? `<button class="btn ghost" type="button" id="statsReset">מחיקת הכול</button>` : ""}</div>`;
  $("veil").hidden = false;
  $("statsClose").onclick = () => { $("veil").hidden = true; };
  if ($("statsReset")) $("statsReset").onclick = () => {
    if (confirm("למחוק את כל הסטטיסטיקה?")) { try { localStorage.removeItem(LS_STATS); localStorage.setItem(LS_GAMES, "[]"); } catch (e) {} showStats(); }
  };
  document.querySelectorAll(".who").forEach(b => b.onclick = () => showGames(b.dataset.n));
  $("statsGames").onclick = () => showGames("");
  $("statsClose").focus();
}
// the games table: every game, newest first, one row per player; filter by name
function showGames(who) {
  const all = loadGames(), names = [...new Set(all.map(g => g.n))].sort((a, b) => a.localeCompare(b, "he"));
  const rows = all.filter(g => !who || g.n === who).reverse();
  const date = t => new Date(t).toLocaleDateString("he-IL", { day: "numeric", month: "numeric", year: "2-digit" });
  const hour = t => new Date(t).toLocaleTimeString("he-IL", { hour: "2-digit", minute: "2-digit" });
  const type = g => { const [sz, kd] = g.k.split("-");
    return `<b class="kind">${g.pl === 1 ? "לבד" : `קבוצתי · ${g.pl} שחקנים`}</b><br>${SIZES[sz]?.label || sz}, ${KINDS.find(x => x.id === kd)?.label || kd}`; };
  // why the score: pairs, misses and (solo only) the seconds of play
  const why = g => { const sec = Math.round(g.t / 1000);
    return `+${g.p * PT_PAIR} זוגות −${g.x * PT_MISS} החמצות${g.pl === 1 ? ` −${sec * PT_SEC} זמן` : ""}`; };
  $("dlg").innerHTML = `
    <h2>📋 טבלת משחקים</h2>
    <label class="hint">שחקן: <select id="gWho"><option value="">כל השחקנים</option>${names.map(n => `<option${n === who ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
    ${rows.length ? `<div class="tblwrap"><table class="tbl log"><thead><tr><th>שם השחקן</th><th>תאריך</th><th>שעה</th><th>סוג משחק</th><th>הרמות</th><th>החמצות</th><th>זמן המשחק</th><th>תוצאה</th></tr></thead><tbody>
      ${rows.map(g => `<tr><td><b class="kind">${esc(g.n)}</b></td><td>${date(g.d)}</td><td>${hour(g.d)}</td><td>${type(g)}</td><td>${g.m}</td><td>${g.x}</td><td>${fmt(g.ms)}</td>
        <td><b>${g.s}</b>${g.w ? " 🥇" : ""}<br><span class="why">${why(g)}</span></td></tr>`).join("")}
      </tbody></table></div>
      <p class="formula">תוצאה = ${PT_PAIR} לכל זוג − ${PT_MISS} לכל החמצה − ${PT_SEC} לכל שנייה (זמן נספר רק במשחק לבד). 🥇 = ניצחון במשחק קבוצתי.</p>`
    : `<p class="hint">עוד אין משחקים בטבלה. מעכשיו כל משחק יירשם כאן.</p>`}
    <div class="row"><button class="btn" type="button" id="logBack">חזרה לסטטיסטיקה</button></div>`;
  $("veil").hidden = false;
  $("gWho").onchange = e => showGames(e.target.value);
  $("logBack").onclick = showStats; $("logBack").focus();
}
$("statsBtn").onclick = showStats;
$("gamesBtn").onclick = () => showGames("");

function toSetup() { clearInterval(clockTimer); $("veil").hidden = true; $("game").hidden = true; $("setup").hidden = false; $("newBtn").hidden = true; G = null; renderSetup(); }
$("newBtn").onclick = toSetup;
$("startBtn").onclick = start;
renderSetup();
</script>
</body>
</html>
